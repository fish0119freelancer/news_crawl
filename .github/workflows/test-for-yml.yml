name: Test Flex Builder

on:
  workflow_dispatch: # manual trigger

jobs:
  test-flex-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run unit tests
        run: pytest tests/test_line_flex_builder.py

      - name: Prepare sample markdown
        run: |
          cat <<'EOF' > sample_flex_report.md
          ![封面](https://picsum.photos/seed/flex1/400/260)
          這是測試文章的摘要內容，主要用來驗證 carousel 呈現長度。
          [點我閱讀原文](https://example.com/article-1)

          ![封面](https://picsum.photos/seed/flex2/400/260)
          第二篇測試文章，含有不同的描述文字，確保解析正常。
          [點我閱讀原文](https://example.com/article-2)

          第三篇沒有圖片，應該生成無 hero 的 bubble。
          [點我閱讀原文](https://example.com/article-3)
          EOF

      - name: Send LINE Flex message
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_REPLY_TOKEN: ${{ secrets.LINE_REPLY_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          set -e
          TODAY=$(date +"%Y%m%d")
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          URL="https://${OWNER}.github.io/${REPO}/news_summary_${TODAY}.pdf"

          if [ -f title.txt ]; then
            TITLES=$(nl -w2 -s'. ' title.txt)
          else
            TITLES="(無標題)"
          fi

          MSG="嗨!大家! 這是今天${TODAY}的每日生醫新聞報告 :\n${TITLES}\n${URL}"

          PAYLOAD=$(jq -n --arg to "${{ secrets.LINE_USER_ID }}" --arg msg "$MSG" \
            '{to:$to, messages:[{type:"text", text:$msg}]}')

          curl -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

